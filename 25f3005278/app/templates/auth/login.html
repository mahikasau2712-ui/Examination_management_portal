{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="auth-card card mx-auto"><div class="card-body p-4 p-lg-5"><p class="eyebrow">WELCOME BACK</p><h1 class="h3 mb-4">Sign in to EMP</h1><form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required autocomplete="email"><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password"><button class="btn btn-primary w-100">Sign in</button></form><hr><p class="mb-1">New student? <a href="{{ url_for('auth.register', role='student') }}">Create an account</a></p><p class="mb-0">Examiner? <a href="{{ url_for('auth.register', role='examiner') }}">Request access</a></p></div></div>{% endblock %}
