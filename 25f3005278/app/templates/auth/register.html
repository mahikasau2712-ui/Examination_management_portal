{% extends 'base.html' %}{% block title %}{{ role|title }} registration{% endblock %}{% block content %}<div class="auth-card card mx-auto"><div class="card-body p-4 p-lg-5"><p class="eyebrow">{{ role|upper }} ACCOUNT</p><h1 class="h3 mb-3">Create your account</h1>{% if role=='examiner' %}<div class="alert alert-info">An administrator must approve examiner accounts before sign in is enabled.</div>{% endif %}<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" maxlength="100" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" maxlength="120" required><label class="form-label">Department</label><input class="form-control mb-3" name="department" maxlength="100"><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" maxlength="30"><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">Register</button></form></div></div>{% endblock %}
