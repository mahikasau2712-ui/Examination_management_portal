{% extends 'base.html' %}{% block title %}My profile{% endblock %}{% block content %}<p class="eyebrow">STUDENT WORKSPACE</p><h1 class="h2 mb-4">My profile</h1><div class="card profile-card"><div class="card-body p-4"><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{ current_user.email }}" required><label class="form-label">Department</label><input class="form-control mb-3" name="department" value="{{ current_user.department or '' }}"><label class="form-label">Phone</label><input class="form-control mb-4" name="phone" value="{{ current_user.phone or '' }}"><button class="btn btn-primary">Save profile</button></form></div></div>{% endblock %}
